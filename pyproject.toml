[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lead-intel-desktop"
version = "0.1.0"
description = "Sandboxed, local-AI company intelligence desktop monitor running on Python"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Soumyajit Bala", email = "soumyajit@zelkyr.dev" }
]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "flask>=3.0.0",
    "playwright>=1.40.0",
    "playwright-stealth>=0.1.6",
    "requests>=2.31.0",
    "pywebview>=5.0.0",
    "PyQt6>=6.11.0",
    "PyQt6-WebEngine>=6.11.0",
    "qtpy>=2.4.3",
]

[tool.hatch.metadata]
allow-direct-references = true

# =============================================================================
# DEVELOPMENT ENVIRONMENT OVERRIDES (UV Configuration)
#
# Configures the package manager to automatically pass GIL-disabled flags
# during testing and execution on local multi-core environments.
# =============================================================================
[tool.uv]
python-preference = "only-managed"
python-downloads = "auto"

[tool.uv.pip]
universal = true

# =============================================================================
# RUFF / CODE FORMATTING CONSTANTS
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []